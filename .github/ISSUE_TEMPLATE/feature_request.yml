name: Feature request
description: Suggest a firmware or host-integration improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that does not work today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Official PCLK firmware
        - USBTMC / SCPI API
        - omariglol integration
        - Build / release / CI
        - Documentation
