name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    # Build with the same pinned Arch toolchain as CI; see ci.yml.
    container:
      image: archlinux:base-devel
    steps:
      # archlinux:base-devel does not ship git, and actions/checkout needs it.
      - name: Compute weekly cache key
        id: cache-epoch
        run: echo "week=$(date +%Y-%W)" >> "$GITHUB_OUTPUT"
      - name: Restore base package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: archlinux-base-devel-pacman-${{ steps.cache-epoch.outputs.week }}
          restore-keys: archlinux-base-devel-pacman-
      - name: Install git for checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Build and verify
        # Temporary allowance: the unofficial image is still below the 200-byte
        # RAM floor until RAM-2/RAM-6 land. Remove this once free RAM is above
        # the floor so the hard failure is enforced again.
        env:
          RAM_ALLOW_LOW: "1"
        run: make dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: NanoVNA USBFix ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/official/NanoVNA-H-1.3.0-omariglol-USB-PCLK.bin
            dist/official/NanoVNA-H-1.3.0-omariglol-USB-PCLK.hex
            dist/official/NanoVNA-H-1.3.0-omariglol-USB-PCLK.elf
            dist/official/NanoVNA-H-1.3.0-omariglol-USB-PCLK.map
            dist/unofficial/NanoVNA-H-1.3.0-omariglol.bin
            dist/unofficial/NanoVNA-H-1.3.0-omariglol.hex
            dist/unofficial/NanoVNA-H-1.3.0-omariglol.elf
            dist/unofficial/NanoVNA-H-1.3.0-omariglol.map
            dist/SHA256SUMS
